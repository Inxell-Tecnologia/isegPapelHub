name: Deploy

# Dispara depois que o workflow CI terminar com sucesso em `main` — não
# duplica lint/build/test aqui (tasks.md seção 7: "build e push da imagem" +
# "deploy no Cloud Run" partem de um código já verificado).
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

  # Disparo manual (change correcoes-herdadas-do-fork). O caminho normal é o
  # `workflow_run` acima; este existe porque o evento pode SE PERDER, e aí não
  # haveria saída. Caso típico: o GitHub desabilita os workflows de um fork
  # recém-criado (implantação por cliente), então o push na `main` acontece com
  # os workflows bloqueados — e habilitá-los depois **não** reexecuta o evento
  # perdido; a implantação fica presa na imagem placeholder do Cloud Run, com o
  # Actions silencioso (runbook, Armadilha 4). Também serve para reimplantar a
  # `main` corrente sem inventar um commit.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

env:
  # Commit implantado: o do run de CI que disparou este workflow, ou o ref do
  # disparo manual. Fonte única — antes `head_sha` aparecia em sete pontos e
  # qualquer gatilho novo exigiria tocar todos.
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  changes:
    name: Detect merge with no effect on production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      no_prod_effect: ${{ steps.classify.outputs.no_prod_effect }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      # Gate "sem efeito em produção" (design.md D10 do change
      # manual-usuario-mkdocs): workflow_run não aceita filtro de `paths`,
      # então classificamos aqui o diff trazido pelo merge (o repo usa merge
      # commit, nunca squash, então SHA^1 é a main anterior). O allowlist
      # cobre documentação, definições de workflow do GitHub Actions e o
      # arquivo de exclusões do controle de versão — nenhum deles compõe a
      # imagem do container, altera o schema ou afeta a revisão implantada.
      # Sem efeito em produção só quando TODO arquivo casa com o allowlist —
      # qualquer arquivo fora, ou ausência de pai único (histórico raso/commit
      # inicial), é fail-safe: implanta normalmente.
      - name: Classify merge as having no effect on production, or not
        id: classify
        run: |
          # Disparo manual é pedido explícito de implantar: o gate existe para
          # poupar build de um merge sem efeito em produção, não para recusar
          # uma implantação que alguém pediu de propósito.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Disparo manual — implantação pedida explicitamente; o gate não se aplica."
            echo "no_prod_effect=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="${TARGET_SHA}"

          if ! git rev-parse "${SHA}^1" >/dev/null 2>&1; then
            echo "Sem pai único para $SHA (commit inicial ou histórico insuficiente) — tratando como COM efeito em produção (fail-safe)."
            echo "no_prod_effect=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "${SHA}^1" "${SHA}")
          echo "Arquivos alterados pelo merge:"
          echo "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "Diff vazio — tratando como COM efeito em produção (fail-safe)."
            echo "no_prod_effect=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NO_PROD_EFFECT=true
          while IFS= read -r FILE; do
            case "$FILE" in
              *.md|docs/*|openspec/*|LICENSE|.github/workflows/*|.gitignore) ;;
              *) NO_PROD_EFFECT=false ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$NO_PROD_EFFECT" = true ]; then
            echo "Merge sem efeito em produção detectado — pulando build/push/migração/deploy."
            echo "no_prod_effect=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merge inclui arquivo fora do allowlist sem efeito em produção — build/push/migração/deploy prosseguem."
            echo "no_prod_effect=false" >> "$GITHUB_OUTPUT"
          fi

  build-push-deploy:
    name: Build, push and deploy
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success') &&
      needs.changes.outputs.no_prod_effect == 'false'
    runs-on: ubuntu-latest

    # Sem chave de service account: autenticação por Workload Identity
    # Federation (ver infra/terraform/cicd.tf) — precisa de id-token write
    # para o OIDC do GitHub Actions.
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/api

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t "${IMAGE}:${TARGET_SHA}" \
            -t "${IMAGE}:latest" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE}:${TARGET_SHA}"
          docker push "${IMAGE}:latest"

      # Migra o schema ANTES de trocar o tráfego (design.md D2): a revisão
      # nova nunca sobe contra um banco desatualizado. `runMigrations()` é
      # idempotente (schema_migrations) — sem migração pendente é no-op.
      # Falha aqui aborta o workflow antes do `deploy` (tráfego permanece na
      # revisão anterior).
      - name: Update migration job image
        run: |
          gcloud run jobs update "${{ vars.GCP_MIGRATE_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE}:${TARGET_SHA}" \
            --quiet

      - name: Run database migrations
        run: |
          gcloud run jobs execute "${{ vars.GCP_MIGRATE_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.GCP_CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE}:${TARGET_SHA}" \
            --quiet

      # Alinha à imagem recém-implantada os demais Jobs que reusam a imagem da
      # aplicação — bootstrap e os agendados (change
      # deploy-atualiza-jobs-agendados). Antes, só o de migração avançava, e os
      # outros ficavam na imagem com que nasceram até um `gcloud` manual — o
      # que quebra o bootstrap (runbook, Fase 4) e deixa Job novo na imagem
      # placeholder.
      #
      # DEPOIS do deploy (design.md D3): falha aqui não impede o serviço de
      # receber a correção; deixa o workflow vermelho, nomeando o Job. Só
      # ATUALIZA — nunca executa: o trash-purge apaga dados definitivamente e os
      # de aviso mandam notificações; eles rodam no horário deles.
      #
      # A lista vem do output `deploy_updated_job_names` do Terraform, origem
      # única das permissões por Job (infra/terraform/locals.tf). Vazia = erro,
      # não sucesso silencioso (design.md D4).
      - name: Update scheduled and bootstrap job images
        env:
          JOBS: ${{ vars.GCP_DEPLOY_UPDATED_JOBS }}
        run: |
          set -euo pipefail
          if [ -z "${JOBS// /}" ]; then
            echo "::error::GCP_DEPLOY_UPDATED_JOBS vazia: preencha a variável de repositório com o output \`terraform output -raw deploy_updated_job_names\`."
            exit 1
          fi
          for JOB in $JOBS; do
            echo "Atualizando a imagem do Job ${JOB} para ${IMAGE}:${TARGET_SHA}"
            gcloud run jobs update "$JOB" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --region "${{ vars.GCP_REGION }}" \
              --image "${IMAGE}:${TARGET_SHA}" \
              --quiet \
              || { echo "::error::Falha ao atualizar a imagem do Job ${JOB}."; exit 1; }
          done
