name: Deploy

# Dispara depois que o workflow CI terminar com sucesso em `main` — não
# duplica lint/build/test aqui (tasks.md seção 7: "build e push da imagem" +
# "deploy no Cloud Run" partem de um código já verificado).
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect merge with no effect on production
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      no_prod_effect: ${{ steps.classify.outputs.no_prod_effect }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Gate "sem efeito em produção" (design.md D10 do change
      # manual-usuario-mkdocs): workflow_run não aceita filtro de `paths`,
      # então classificamos aqui o diff trazido pelo merge (o repo usa merge
      # commit, nunca squash, então SHA^1 é a main anterior). O allowlist
      # cobre documentação, definições de workflow do GitHub Actions e o
      # arquivo de exclusões do controle de versão — nenhum deles compõe a
      # imagem do container, altera o schema ou afeta a revisão implantada.
      # Sem efeito em produção só quando TODO arquivo casa com o allowlist —
      # qualquer arquivo fora, ou ausência de pai único (histórico raso/commit
      # inicial), é fail-safe: implanta normalmente.
      - name: Classify merge as having no effect on production, or not
        id: classify
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"

          if ! git rev-parse "${SHA}^1" >/dev/null 2>&1; then
            echo "Sem pai único para $SHA (commit inicial ou histórico insuficiente) — tratando como COM efeito em produção (fail-safe)."
            echo "no_prod_effect=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "${SHA}^1" "${SHA}")
          echo "Arquivos alterados pelo merge:"
          echo "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "Diff vazio — tratando como COM efeito em produção (fail-safe)."
            echo "no_prod_effect=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NO_PROD_EFFECT=true
          while IFS= read -r FILE; do
            case "$FILE" in
              *.md|docs/*|openspec/*|LICENSE|.github/workflows/*|.gitignore) ;;
              *) NO_PROD_EFFECT=false ;;
            esac
          done <<< "$CHANGED_FILES"

          if [ "$NO_PROD_EFFECT" = true ]; then
            echo "Merge sem efeito em produção detectado — pulando build/push/migração/deploy."
            echo "no_prod_effect=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merge inclui arquivo fora do allowlist sem efeito em produção — build/push/migração/deploy prosseguem."
            echo "no_prod_effect=false" >> "$GITHUB_OUTPUT"
          fi

  build-push-deploy:
    name: Build, push and deploy
    needs: changes
    if: github.event.workflow_run.conclusion == 'success' && needs.changes.outputs.no_prod_effect == 'false'
    runs-on: ubuntu-latest

    # Sem chave de service account: autenticação por Workload Identity
    # Federation (ver infra/terraform/cicd.tf) — precisa de id-token write
    # para o OIDC do GitHub Actions.
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/api

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t "${IMAGE}:${{ github.event.workflow_run.head_sha }}" \
            -t "${IMAGE}:latest" \
            .

      - name: Push image
        run: |
          docker push "${IMAGE}:${{ github.event.workflow_run.head_sha }}"
          docker push "${IMAGE}:latest"

      # Migra o schema ANTES de trocar o tráfego (design.md D2): a revisão
      # nova nunca sobe contra um banco desatualizado. `runMigrations()` é
      # idempotente (schema_migrations) — sem migração pendente é no-op.
      # Falha aqui aborta o workflow antes do `deploy` (tráfego permanece na
      # revisão anterior).
      - name: Update migration job image
        run: |
          gcloud run jobs update "${{ vars.GCP_MIGRATE_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE}:${{ github.event.workflow_run.head_sha }}" \
            --quiet

      - name: Run database migrations
        run: |
          gcloud run jobs execute "${{ vars.GCP_MIGRATE_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait

      # bootstrap/trash_purge/notify_expiring_grants não são executados pelo
      # pipeline (o primeiro é manual, sob demanda do operador; os outros dois
      # rodam pelo próprio Cloud Scheduler) — mas sem manter a imagem deles em
      # dia aqui, ficam presos para sempre na imagem placeholder do primeiro
      # `terraform apply` (`us-docker.pkg.dev/cloudrun/container/hello`, que
      # nem tem Node), e qualquer execução (manual ou agendada) falha com
      # "Application failed to start" sem log nenhum da aplicação — foi
      # exatamente o que aconteceu com o Job de bootstrap antes desta mudança.
      - name: Update bootstrap job image
        run: |
          gcloud run jobs update "${{ vars.GCP_BOOTSTRAP_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE}:${{ github.event.workflow_run.head_sha }}" \
            --quiet

      - name: Update trash purge job image
        run: |
          gcloud run jobs update "${{ vars.GCP_TRASH_PURGE_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE}:${{ github.event.workflow_run.head_sha }}" \
            --quiet

      - name: Update notify expiring grants job image
        run: |
          gcloud run jobs update "${{ vars.GCP_NOTIFY_GRANTS_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE}:${{ github.event.workflow_run.head_sha }}" \
            --quiet

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.GCP_CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE}:${{ github.event.workflow_run.head_sha }}" \
            --quiet
