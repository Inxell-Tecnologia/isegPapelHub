site_name: Manual do Usuário — PapelHub
site_description: Manual funcional do PapelHub — como usar o sistema no dia a dia.
site_url: https://inxell-tecnologia.github.io/isegPapelHub/
docs_dir: docs
strict: true

theme:
  name: material
  language: pt-BR
  # Símbolo negativo sobre o cabeçalho verde-petróleo; colorido na aba do
  # navegador (change sync-upstream-identidade-iseg, design.md D4).
  logo: assets/iseg-simbolo-negativo.png
  favicon: assets/iseg-simbolo-cor.png
  # Paleta "custom": as cores da marca vêm de stylesheets/marca.css, derivadas
  # da logo do ISEG — as mesmas da aplicação (app/theme.ts).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.action.edit

extra_css:
  - stylesheets/marca.css

# Caixas de aviso (`!!! note`, `!!! warning`…): 34 delas em 13 páginas eram
# renderizadas como texto literal, porque a extensão nunca foi habilitada
# (change correcoes-herdadas-do-fork).
markdown_extensions:
  - admonition

nav:
  - Início: index.md
  - Primeiro acesso: primeiro-acesso.md
  - A tela: a-tela.md
  - Colaborador:
      - Navegar e criar pastas: colaborador/navegar-e-criar.md
      - Enviar arquivos: colaborador/enviar.md
      - Controle documental: colaborador/controle-documental.md
      - Visualizar e baixar: colaborador/visualizar-e-baixar.md
      - Mover, renomear e excluir: colaborador/renomear-e-excluir.md
      - Buscar e filtrar: colaborador/buscar.md
      - Favoritos: colaborador/favoritos.md
      - Leitura obrigatória: colaborador/leitura-obrigatoria.md
      - Compartilhados comigo: colaborador/compartilhados-comigo.md
      - Auditoria: colaborador/auditoria.md
      - Minha conta: colaborador/minha-conta.md
  - Administrador:
      - Colaboradores: administrador/pessoas.md
      - Permissões: administrador/permissoes.md
      - Auditoria da unidade: administrador/auditoria.md
      - Painel gerencial: administrador/painel.md
      - Unidades (admin. global): administrador/unidades.md
  - Referência:
      - Tarefas rápidas: referencia/tarefas-rapidas.md
      - Limites: referencia/limites.md
      - Perguntas frequentes: referencia/faq.md
